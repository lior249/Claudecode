<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TikTok Elite</title>
  <meta name="description" content="Rejoins le TikTok Elite." />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body class="join">
  <main class="join-card">
    <picture>
      <source srcset="img/tiktok-elite.avif" type="image/avif" />
      <img class="thumb" src="img/tiktok-elite.jpg" alt="Elite" width="640" height="360" />
    </picture>
    <h1>Rejoins le TikTok Elite</h1>
    <p class="price" data-price>120€ jusqu’au 11 nov 2026</p>
    <div class="join-buttons" data-pay-zone>
      <a class="btn btn-gold" data-pay href="#">Je paye par carte</a>
      <a class="btn btn-outline" data-pay href="#">Payer par mobile money</a>
      <span class="ring" role="status" aria-label="Redirection vers le paiement…"></span>
    </div>
    <section class="results" data-results aria-label="Résultats de membres"></section>
  </main>
  <script src="main.js"></script>
</body>
</html>
